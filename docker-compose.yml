version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gbrc-network
    restart: unless-stopped

  ml-service:
    build: 
      context: ./ml-service
    ports:
      - "8001:8000"
    networks:
      - gbrc-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  backend:
    build:
      context: ./backend
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/gbrc
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - mongodb
      - ml-service
    networks:
      - gbrc-network
    restart: unless-stopped
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - gbrc-network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongo_data:

networks:
  gbrc-network:
    driver: bridge
